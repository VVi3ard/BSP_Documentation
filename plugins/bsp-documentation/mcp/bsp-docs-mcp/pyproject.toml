[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bsp-docs-mcp"
version = "0.1.0"
description = "Version-aware semantic search MCP server for 1C BSP documentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "markdownify>=0.13,<1",
  "mcp>=1.9,<2",
  "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[project.scripts]
bsp-docs-mcp = "bsp_docs_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bsp_docs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
